<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Quản Lý Đặt Bàn | La Fiorentina Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Lato:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --wine:        #5E1A24;
  --wine-deep:   #3E0F16;
  --olive:       #4B5A34;
  --olive-dim:   #38431F;
  --cream:       #F6EFE2;
  --cream-soft:  #FBF7EE;
  --gold:        #B8924F;
  --gold-bright: #D8B978;
  --ink:         #2B211C;
  --ink-soft:    #5A4F47;

  --font-display: 'Playfair Display', Georgia, serif;
  --font-body:    'Lato', 'Segoe UI', sans-serif;

  --radius: 3px;
  --transition: 0.3s ease;
}

*{ margin:0; padding:0; box-sizing:border-box; }
body{
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--cream);
  line-height: 1.6;
  min-height: 100vh;
}
a{ color:inherit; text-decoration:none; }
h1,h2,h3{ font-family:var(--font-display); font-weight:600; color:var(--wine-deep); }
.container{ max-width: 1100px; margin: 0 auto; padding: 0 24px; }

.btn{
  display:inline-flex; align-items:center; gap:8px;
  font-family:var(--font-body); font-weight:700; font-size:.92rem;
  letter-spacing:.06em; padding:11px 22px; border:1px solid transparent;
  border-radius: var(--radius); cursor:pointer; transition: all var(--transition);
}
.btn-gold{ background:var(--gold); color:var(--wine-deep); }
.btn-gold:hover{ background:var(--gold-bright); }
.btn-outline{ background:transparent; border-color:var(--wine); color:var(--wine); }
.btn-outline:hover{ background:rgba(94,26,36,.06); }
.btn-ghost{ background:transparent; border-color: rgba(246,239,226,.4); color:var(--cream); }
.btn-ghost:hover{ background:rgba(246,239,226,.12); }
.btn-sm{ padding:7px 16px; font-size:.8rem; }
.btn:disabled{ opacity:.5; cursor:not-allowed; }

/* ===== LOGIN GATE ===== */
#loginGate{
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  background: var(--wine-deep);
}
.login-card{
  background: var(--cream-soft); border-radius: var(--radius); padding: 44px 40px;
  width:100%; max-width: 400px; border-top: 3px solid var(--gold);
  box-shadow: 0 30px 60px -20px rgba(0,0,0,.5);
}
.login-card h1{ font-size:1.5rem; margin-bottom:6px; }
.login-card p{ color:var(--ink-soft); font-size:.9rem; margin-bottom:26px; }
.login-card label{ font-size:.76rem; text-transform:uppercase; letter-spacing:.08em; font-weight:700; color:var(--ink-soft); display:block; margin-bottom:8px; }
.login-card input{
  width:100%; padding:13px 16px; border:1px solid rgba(43,33,28,.18); border-radius:var(--radius);
  font-size:1rem; margin-bottom:16px; font-family: var(--font-body);
}
.login-card input:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(184,146,79,.18); }
.login-card .btn{ width:100%; justify-content:center; }
.login-error{ color:var(--wine); font-size:.86rem; font-weight:700; margin-bottom:14px; min-height:1.2em; }

/* ===== DASHBOARD ===== */
#dashboard{ display:none; }
.admin-header{
  background: var(--wine-deep); color: var(--cream); padding: 20px 0;
}
.admin-header .container{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px; }
.admin-header h1{ color:var(--cream); font-size:1.3rem; }
.admin-header .sub{ color: var(--gold-bright); font-size:.78rem; letter-spacing:.1em; text-transform:uppercase; }

.dash-body{ padding: 40px 0 80px; }

.stats-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-bottom:34px; }
.stat-card{
  background:var(--cream-soft); border-radius:var(--radius); padding:22px 24px;
  border-left: 4px solid var(--gold);
}
.stat-card.pending{ border-left-color: var(--gold); }
.stat-card.confirmed{ border-left-color: var(--olive); }
.stat-card.cancelled{ border-left-color: var(--wine); }
.stat-card .num{ font-family:var(--font-display); font-size:2rem; color:var(--wine-deep); }
.stat-card .label{ font-size:.8rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; }

.filter-bar{
  display:flex; align-items:end; gap:16px; flex-wrap:wrap; margin-bottom:28px;
  background: var(--cream-soft); padding:20px 22px; border-radius: var(--radius);
}
.filter-field{ display:flex; flex-direction:column; gap:6px; }
.filter-field label{ font-size:.72rem; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-soft); font-weight:700; }
.filter-field input, .filter-field select{
  padding:9px 12px; border:1px solid rgba(43,33,28,.18); border-radius:var(--radius);
  font-family:var(--font-body); font-size:.92rem;
}
.chip-row{ display:flex; gap:8px; flex-wrap:wrap; }
.chip{
  padding:8px 16px; border-radius:20px; border:1px solid rgba(43,33,28,.18);
  font-size:.82rem; cursor:pointer; background:#fff; transition: all var(--transition);
}
.chip.active{ background:var(--wine); border-color:var(--wine); color:var(--cream); }
.filter-bar .spacer{ flex:1; }

.res-list{ display:flex; flex-direction:column; gap:14px; }
.res-row{
  background:#fff; border-radius:var(--radius); padding:20px 24px;
  display:grid; grid-template-columns: 1.4fr 1.3fr .8fr 1fr auto; gap:18px; align-items:center;
  border-left:4px solid var(--gold);
}
.res-row.status-confirmed{ border-left-color: var(--olive); }
.res-row.status-cancelled{ border-left-color: var(--wine); opacity:.7; }

.res-name{ font-family:var(--font-display); font-size:1.08rem; color:var(--wine-deep); }
.res-phone{ font-size:.86rem; color:var(--ink-soft); }
.res-phone a{ color:var(--wine); font-weight:700; }
.res-datetime{ font-size:.9rem; }
.res-datetime .date{ font-weight:700; }
.res-datetime .time{ color:var(--ink-soft); }
.res-party{ font-size:.88rem; color:var(--ink-soft); }
.res-note{ font-size:.82rem; color:var(--ink-soft); font-style:italic; margin-top:4px; }
.res-meta{ font-size:.72rem; color:rgba(43,33,28,.5); margin-top:6px; }

.status-badge{
  display:inline-block; padding:4px 12px; border-radius:20px; font-size:.72rem;
  font-weight:700; letter-spacing:.05em; text-transform:uppercase; margin-bottom:8px;
}
.status-badge.pending{ background:rgba(184,146,79,.18); color:#8a6a34; }
.status-badge.confirmed{ background:rgba(75,90,52,.16); color:var(--olive); }
.status-badge.cancelled{ background:rgba(94,26,36,.12); color:var(--wine); }

.res-actions{ display:flex; flex-direction:column; gap:8px; }

.empty-state, .loading-state, .error-banner{
  text-align:center; padding:60px 20px; color:var(--ink-soft);
}
.error-banner{ background:rgba(94,26,36,.08); color:var(--wine); border-radius:var(--radius); font-weight:600; }

@media (max-width: 900px){
  .res-row{ grid-template-columns: 1fr 1fr; }
  .res-actions{ grid-column: 1 / -1; flex-direction:row; }
}
@media (max-width: 560px){
  .stats-row{ grid-template-columns:1fr; }
  .res-row{ grid-template-columns: 1fr; }
  .filter-bar{ flex-direction:column; align-items:stretch; }
}
</style>
</head>
<body>

<!-- ======================= LOGIN GATE ======================= -->
<div id="loginGate">
  <div class="login-card">
    <h1>Quản Lý Đặt Bàn</h1>
    <p>La Fiorentina — nhập mã truy cập nội bộ để xem danh sách đơn.</p>
    <form id="loginForm">
      <label for="apiKeyInput">Mã truy cập (Admin API Key)</label>
      <input type="password" id="apiKeyInput" autocomplete="off" required>
      <div class="login-error" id="loginError"></div>
      <button type="submit" class="btn btn-gold" id="loginBtn">Đăng Nhập</button>
    </form>
  </div>
</div>

<!-- ======================= DASHBOARD ======================= -->
<div id="dashboard">
  <header class="admin-header">
    <div class="container">
      <div>
        <span class="sub">La Fiorentina</span>
        <h1>Quản Lý Đơn Đặt Bàn</h1>
      </div>
      <button class="btn btn-ghost btn-sm" id="logoutBtn">Đăng Xuất</button>
    </div>
  </header>

  <div class="dash-body container">
    <div class="stats-row">
      <div class="stat-card pending">
        <div class="num" id="statPending">–</div>
        <div class="label">Chờ xác nhận</div>
      </div>
      <div class="stat-card confirmed">
        <div class="num" id="statConfirmed">–</div>
        <div class="label">Đã xác nhận</div>
      </div>
      <div class="stat-card cancelled">
        <div class="num" id="statCancelled">–</div>
        <div class="label">Đã hủy</div>
      </div>
    </div>

    <div class="filter-bar">
      <div class="filter-field">
        <label for="filterDate">Lọc theo ngày</label>
        <input type="date" id="filterDate">
      </div>
      <div class="filter-field">
        <label for="filterStatus">Trạng thái</label>
        <select id="filterStatus">
          <option value="">Tất cả</option>
          <option value="pending">Chờ xác nhận</option>
          <option value="confirmed">Đã xác nhận</option>
          <option value="cancelled">Đã hủy</option>
        </select>
      </div>
      <div class="chip-row">
        <button type="button" class="chip active" data-quick="all">Tất cả</button>
        <button type="button" class="chip" data-quick="today">Hôm nay</button>
        <button type="button" class="chip" data-quick="pending">Chờ xác nhận</button>
      </div>
      <div class="spacer"></div>
      <button class="btn btn-outline btn-sm" id="refreshBtn">🔄 Làm mới</button>
    </div>

    <div id="listWrap">
      <div class="loading-state" id="loadingState">Đang tải danh sách...</div>
      <div class="res-list" id="resList"></div>
    </div>
  </div>
</div>

<script>
// ⚠️ Đổi URL này thành domain thật của backend sau khi deploy (khớp với index.html)
const API_BASE = 'https://api.lafiorentina.vn/api/reservations';

const loginGate   = document.getElementById('loginGate');
const dashboard   = document.getElementById('dashboard');
const loginForm   = document.getElementById('loginForm');
const apiKeyInput = document.getElementById('apiKeyInput');
const loginError  = document.getElementById('loginError');
const loginBtn    = document.getElementById('loginBtn');
const logoutBtn   = document.getElementById('logoutBtn');

const filterDate   = document.getElementById('filterDate');
const filterStatus = document.getElementById('filterStatus');
const refreshBtn   = document.getElementById('refreshBtn');
const chips        = document.querySelectorAll('.chip');

const listWrap     = document.getElementById('listWrap');
const loadingState = document.getElementById('loadingState');
const resList      = document.getElementById('resList');

const statPending   = document.getElementById('statPending');
const statConfirmed = document.getElementById('statConfirmed');
const statCancelled = document.getElementById('statCancelled');

const STATUS_LABEL = { pending: 'Chờ xác nhận', confirmed: 'Đã xác nhận', cancelled: 'Đã hủy' };

function getKey(){ return sessionStorage.getItem('admin_api_key') || ''; }

function formatDateVN(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('vi-VN', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' });
}

function formatCreatedAt(isoStr){
  try {
    const d = new Date(isoStr.replace(' ', 'T') + 'Z');
    return d.toLocaleString('vi-VN', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
  } catch { return isoStr; }
}

async function apiFetch(path, options = {}) {
  const res = await fetch(API_BASE + path, {
    ...options,
    headers: { 'x-admin-key': getKey(), 'Content-Type': 'application/json', ...(options.headers || {}) }
  });
  if (res.status === 401) {
    sessionStorage.removeItem('admin_api_key');
    showLogin('Mã truy cập không đúng hoặc đã hết hạn, vui lòng đăng nhập lại.');
    throw new Error('unauthorized');
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Có lỗi xảy ra');
  return data;
}

function showLogin(errorMsg) {
  dashboard.style.display = 'none';
  loginGate.style.display = 'flex';
  loginError.textContent = errorMsg || '';
}

function showDashboard() {
  loginGate.style.display = 'none';
  dashboard.style.display = 'block';
}

function buildQuery() {
  const params = new URLSearchParams();
  if (filterDate.value) params.set('date', filterDate.value);
  if (filterStatus.value) params.set('status', filterStatus.value);
  const qs = params.toString();
  return qs ? '?' + qs : '';
}

function renderStats(items) {
  statPending.textContent   = items.filter(r => r.status === 'pending').length;
  statConfirmed.textContent = items.filter(r => r.status === 'confirmed').length;
  statCancelled.textContent = items.filter(r => r.status === 'cancelled').length;
}

function renderList(items) {
  resList.innerHTML = '';

  if (items.length === 0) {
    resList.innerHTML = '<div class="empty-state">Không có đơn đặt bàn nào khớp bộ lọc hiện tại.</div>';
    return;
  }

  items.forEach(r => {
    const row = document.createElement('div');
    row.className = `res-row status-${r.status}`;

    let actions = '';
    if (r.status === 'pending') {
      actions = `
        <button class="btn btn-gold btn-sm" data-action="confirmed" data-id="${r.id}">Xác nhận</button>
        <button class="btn btn-outline btn-sm" data-action="cancelled" data-id="${r.id}">Hủy</button>`;
    } else if (r.status === 'confirmed') {
      actions = `<button class="btn btn-outline btn-sm" data-action="cancelled" data-id="${r.id}">Hủy</button>`;
    } else {
      actions = `<button class="btn btn-outline btn-sm" data-action="pending" data-id="${r.id}">Khôi phục</button>`;
    }

    row.innerHTML = `
      <div>
        <span class="status-badge ${r.status}">${STATUS_LABEL[r.status] || r.status}</span>
        <div class="res-name">${escapeHtml(r.name)}</div>
        <div class="res-phone"><a href="tel:${r.phone}">${escapeHtml(r.phone)}</a>${r.email ? ' · ' + escapeHtml(r.email) : ''}</div>
      </div>
      <div class="res-datetime">
        <div class="date">${formatDateVN(r.reservation_date)}</div>
        <div class="time">Lúc ${escapeHtml(r.reservation_time)}</div>
      </div>
      <div class="res-party">👥 ${r.party_size} khách</div>
      <div>
        ${r.note ? `<div class="res-note">"${escapeHtml(r.note)}"</div>` : '<div class="res-note">— không có ghi chú —</div>'}
        <div class="res-meta">Đặt lúc: ${formatCreatedAt(r.created_at)} · #${r.id}</div>
      </div>
      <div class="res-actions">${actions}</div>
    `;
    resList.appendChild(row);
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

async function loadReservations() {
  loadingState.style.display = 'block';
  resList.innerHTML = '';
  try {
    const items = await apiFetch(buildQuery());
    renderStats(items);
    renderList(items);
  } catch (err) {
    if (err.message !== 'unauthorized') {
      resList.innerHTML = `<div class="error-banner">Không tải được danh sách: ${escapeHtml(err.message)}</div>`;
    }
  } finally {
    loadingState.style.display = 'none';
  }
}

async function updateStatus(id, status) {
  try {
    await apiFetch(`/${id}`, { method: 'PATCH', body: JSON.stringify({ status }) });
    loadReservations();
  } catch (err) {
    if (err.message !== 'unauthorized') alert('Không cập nhật được: ' + err.message);
  }
}

// ===== Sự kiện =====
loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const key = apiKeyInput.value.trim();
  if (!key) return;

  loginBtn.disabled = true;
  loginBtn.textContent = 'Đang kiểm tra...';
  loginError.textContent = '';
  sessionStorage.setItem('admin_api_key', key);

  try {
    await loadReservations();
    showDashboard();
  } catch (err) {
    if (err.message === 'unauthorized') {
      loginError.textContent = 'Mã truy cập không đúng, vui lòng thử lại.';
    } else {
      loginError.textContent = 'Không kết nối được server: ' + err.message;
    }
    sessionStorage.removeItem('admin_api_key');
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = 'Đăng Nhập';
  }
});

logoutBtn.addEventListener('click', () => {
  sessionStorage.removeItem('admin_api_key');
  apiKeyInput.value = '';
  showLogin();
});

refreshBtn.addEventListener('click', loadReservations);
filterDate.addEventListener('change', loadReservations);
filterStatus.addEventListener('change', loadReservations);

chips.forEach(chip => {
  chip.addEventListener('click', () => {
    chips.forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    const mode = chip.dataset.quick;
    if (mode === 'all') { filterDate.value = ''; filterStatus.value = ''; }
    if (mode === 'today') { filterDate.value = new Date().toISOString().split('T')[0]; filterStatus.value = ''; }
    if (mode === 'pending') { filterStatus.value = 'pending'; }
    loadReservations();
  });
});

resList.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  updateStatus(btn.dataset.id, btn.dataset.action);
});

// ===== Khởi động =====
if (getKey()) {
  loadReservations().then(showDashboard).catch(() => {});
} else {
  showLogin();
}
</script>
</body>
</html>
